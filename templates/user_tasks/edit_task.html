{% extends "base.html" %}
{% block title %}Edit Task{% endblock %}

{% block content %}
<div class="dashboard">
    <h1>Edit Task</h1>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
        <div class="form-field">
            <label for="{{ field.id_for_label }}">
                {{ field.label }}:
            </label>

            {{ field }}

            {% if field.help_text %}
                <div class="tooltip">
                    {{ field.help_text }}
                </div>
            {% endif %}

            {% for error in field.errors %}
                <p class="error">{{ error }}</p>
            {% endfor %}
        </div>
        {% endfor %}

        <button type="submit">Save Changes</button>
        <button type="button" onclick="history.back()">Cancel</button>
    </form>
</div>
{% endblock %}
